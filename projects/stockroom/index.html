<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Stockroom is a working inventory management practice app by Yidel Brown."><title>Stockroom — Simple Inventory Management</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"><script src="app.js" defer></script></head><body>
<aside><a class="logo" href="../../"><i>⬡</i> stockroom</a><nav><button class="active">▦ <span>Inventory</span></button><button>⇄ <span>Movements</span></button><button>▥ <span>Reports</span></button></nav><a class="back" href="../../">← Portfolio</a><div class="user"><b>YB</b><span>Practice workspace<small>Local browser data</small></span></div></aside>
<main><header><div><small>SELF-INITIATED PRACTICE APP</small><h1>Inventory</h1><p>Track products, stock levels, and low-stock items.</p></div><button class="primary" id="add">+ Add item</button></header>
<section class="metrics"><article><i>▦</i><span>Total products<strong id="total-products">0</strong></span></article><article><i>!</i><span>Low stock<strong id="low-count">0</strong></span></article><article><i>£</i><span>Stock value<strong id="stock-value">£0</strong></span></article><article><i>✓</i><span>Healthy stock<strong id="healthy-percent">0%</strong></span></article></section>
<section class="panel"><div class="toolbar"><div class="search">⌕ <input id="search" placeholder="Search products or SKU"></div><select id="category"><option value="all">All categories</option><option>Accessories</option><option>Office</option><option>Electronics</option><option>Packaging</option></select><select id="status"><option value="all">All stock levels</option><option value="low">Low stock</option><option value="healthy">Healthy</option></select><button id="export">Export CSV</button></div><div class="table-wrap"><table><thead><tr><th>Product</th><th>SKU</th><th>Category</th><th>Price</th><th>In stock</th><th>Status</th><th></th></tr></thead><tbody id="inventory"></tbody></table></div></section></main>
<dialog id="item-dialog"><form id="item-form"><button class="close" type="button">×</button><small>NEW INVENTORY ITEM</small><h2>Add a product</h2><label>Product name<input id="name" required maxlength="50" placeholder="e.g. Wireless keyboard"></label><div class="form-grid"><label>SKU<input id="sku" required maxlength="16" placeholder="KEY-104"></label><label>Category<select id="item-category"><option>Accessories</option><option>Office</option><option>Electronics</option><option>Packaging</option></select></label><label>Unit price (£)<input id="price" type="number" min="0" step="0.01" required value="12.50"></label><label>Starting quantity<input id="quantity" type="number" min="0" required value="10"></label></div><label>Low-stock alert at<input id="threshold" type="number" min="1" required value="5"></label><button class="primary submit" type="submit">Add to inventory</button></form></dialog><div id="toast" class="toast"></div>
</body></html>
